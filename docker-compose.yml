services:
  stowage:
    build: .
    image: stowage-service:latest
    container_name: stowage-service
    restart: unless-stopped
    ports:
      - "${STOWAGE_PORT:-8000}:8000"
    environment:
      # 容器内固定使用 SQLite 文件；宿主机通过卷持久化
      STOWAGE_DATABASE_URL: "sqlite:////app/data/stowage.db"
    volumes:
      - stowage-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  stowage-data:
